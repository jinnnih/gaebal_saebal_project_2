# PROJECT_2 ros_gz_bridge 토픽 매핑
#
# 로봇 2대(robot1, robot2)와 시계만 넘긴다. 관제 서버는 rosbridge 로 이 토픽들을
# 보게 된다 (계획서 5장 서버-로봇 메시지 규격).
#
#   gz_topic_name   Gazebo 쪽 이름
#   ros_topic_name  ROS 쪽 이름
#   direction       GZ_TO_ROS / ROS_TO_GZ / BIDIRECTIONAL

# ── 시계 ──────────────────────────────────────────────────────────────────
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# ── robot1 ────────────────────────────────────────────────────────────────
- ros_topic_name: "/robot1/cmd_vel"
  gz_topic_name: "/robot1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot1/odom"
  gz_topic_name: "/robot1/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/scan"
  gz_topic_name: "/robot1/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/imu"
  gz_topic_name: "/robot1/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/joint_states"
  gz_topic_name: "/robot1/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot1/pod_cam/image"
  gz_topic_name: "/robot1/pod_cam/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# 리프트 목표 높이(m). 0.0 내림 / 0.14 올림
- ros_topic_name: "/robot1/lift/cmd"
  gz_topic_name: "/robot1/lift/cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot1/tf"
  gz_topic_name: "/robot1/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# ── robot2 ────────────────────────────────────────────────────────────────
- ros_topic_name: "/robot2/cmd_vel"
  gz_topic_name: "/robot2/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot2/odom"
  gz_topic_name: "/robot2/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/scan"
  gz_topic_name: "/robot2/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/imu"
  gz_topic_name: "/robot2/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/joint_states"
  gz_topic_name: "/robot2/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/pod_cam/image"
  gz_topic_name: "/robot2/pod_cam/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/robot2/lift/cmd"
  gz_topic_name: "/robot2/lift/cmd"
  ros_type_name: "std_msgs/msg/Float64"
  gz_type_name: "gz.msgs.Double"
  direction: ROS_TO_GZ

- ros_topic_name: "/robot2/tf"
  gz_topic_name: "/robot2/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
